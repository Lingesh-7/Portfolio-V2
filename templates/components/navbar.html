{% from "components/_macros.html" import logo %}
<nav class="navbar-custom" aria-label="Main">
  <div class="nav-container">

    <a href="/" class="logo" aria-label="Lingesh R, home">
      {{ logo(38) }}
      <span class="logo-text">Lingesh<span>.</span>R</span>
    </a>

    <div class="nav-links">
      <a href="/#experience" data-section="experience">Experience</a>
      <a href="/#projects" data-section="projects">Projects</a>
      <a href="/#skills" data-section="skills">AI Stack</a>
      <a href="/#achievements" data-section="achievements">Awards</a>
      <a href="/#certifications" data-section="certifications">Certifications</a>
    </div>

    <div class="nav-actions">
      <button class="nav-kbd" id="paletteBtn" type="button" aria-label="Open quick navigation"><span>Quick jump</span><kbd>Ctrl K</kbd></button>

      <div class="theme-wrap">
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Change colour theme" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.9 0-1.7-1-1.9-1-3.1 0-1 .8-1.7 1.9-1.7H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/></svg>
        </button>
        <div class="theme-menu" id="themeMenu" role="menu" aria-label="Colour theme" hidden>
          <div class="theme-title">Colour theme</div>
          <button class="theme-opt" type="button" role="menuitemradio" data-theme="ember" style="--c1:#ff6b35;--c2:#ffaa44"><span class="sw"></span>Ember (original)<span class="tick">✓</span></button>
          <button class="theme-opt" type="button" role="menuitemradio" data-theme="slate" style="--c1:#f0b95b;--c2:#3fc1b0"><span class="sw"></span>Slate &amp; Gold<span class="tick">✓</span></button>
          <button class="theme-opt" type="button" role="menuitemradio" data-theme="dusk" style="--c1:#ff7a59;--c2:#a78bfa"><span class="sw"></span>Dusk<span class="tick">✓</span></button>
          <button class="theme-opt" type="button" role="menuitemradio" data-theme="sage" style="--c1:#7ee0a8;--c2:#e8cf8c"><span class="sw"></span>Sage<span class="tick">✓</span></button>
          <button class="theme-opt" type="button" role="menuitemradio" data-theme="paper" style="--c1:#c63f24;--c2:#4f46e5"><span class="sw"></span>Paper (light)<span class="tick">✓</span></button>
          <button class="theme-opt" type="button" role="menuitemradio" data-theme="mono" style="--c1:#c6f432;--c2:#f2f2f2"><span class="sw"></span>Mono Lime<span class="tick">✓</span></button>
        </div>
      </div>

      <a href="/resume" class="btn-resume" target="_blank" rel="noopener">Resume</a>
      <a href="/contact" class="btn-sayhello">Say Hello</a>
      <button class="nav-hamburger" id="navHamburger" type="button" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</nav>

<!-- Mobile menu drawer -->
<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-menu-inner">
    <a href="/#experience" class="mobile-link">Experience</a>
    <a href="/#projects" class="mobile-link">Projects</a>
    <a href="/#skills" class="mobile-link">AI Stack</a>

    <a href="/#certifications" class="mobile-link">Certifications</a>
    <a href="/resume" class="mobile-link" target="_blank" rel="noopener">Resume</a>
    <a href="/contact" class="mobile-link highlight">Say Hello →</a>
  </div>
</div>
