<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Say Hello | Lingesh R</title>
  <link rel="icon" href="{{ url_for('static', filename='images/image.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>
  <div class="scroll-progress"></div>

  {% include "components/navbar.html" %}

  <section class="contact-section">
    <div class="contact-wrapper">

      <span class="section-label" style="display:block; text-align:center;">Contact</span>
      <h2 class="section-title" style="text-align:center; font-size:38px;">Say Hello 👋</h2>

      <p class="contact-subtext">
        Interested in collaborating or building AI systems?<br>
        Send me a message — I'd love to hear from you.
      </p>

      <form class="contact-form" action="/send_message" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
        <button type="submit" class="contact-btn">Send Message →</button>
      </form>

    </div>
  </section>

  {% include "components/footer.html" %}

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
