        <h2 class="animated-role">
          <span id="typed-role"></span>
        </h2>

        <p class="hero-desc">

        <div class="hero-photo-ring"></div>
        <div class="hero-photo-ring-2"></div>
        <div class="hero-photo-glow"></div>
        <img src="{{ url_for('static', filename='images/lingesh.jpg') }}" alt="Lingesh R">
        <div class="hero-badge">
          <span class="badge-dot"></span>
          <span>Open to Work</span>
